name: Add Internal Links

on:
  workflow_dispatch:
    inputs:
      site:
        description: 'Site to process (dfw or socal)'
        required: true
        default: 'dfw'
        type: choice
        options:
          - dfw
          - socal

jobs:
  add-internal-links:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run internal linking script
        env:
          SITE: ${{ github.event.inputs.site }}
        run: python scripts/add_internal_links.py

      - name: Update sitemap
        run: python scripts/generate_sitemap.py

      - name: Commit and push
        run: |
          git config --global user.name "Internal Links Bot"
          git config --global user.email "bot@topdfwhousebuyers.com"
          git add -A
          git diff --staged --quiet || git commit -m "Auto: Added internal links (blog ↔ city pages)"
          git push
